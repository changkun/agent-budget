# Experiment rules shared by both phases. Fixed before any run; never edited mid-run.

weeks = 8
backlog_size = 40
reps = 3
groups = ["nomaint", "maint"]

# Weekly budget = calibration mean item cost * budget_multiplier.
budget_multiplier = 4.5
# Item cap = calibration cost quantile(cap_quantile) * cap_multiplier.
cap_quantile = 0.8
cap_multiplier = 1.5
# Maintenance task cap = item cap * maint_cap_multiplier.
maint_cap_multiplier = 1.0
# Debug attempts after a failed acceptance check.
max_debug = 2
# Number of calibration items (not part of the backlog).
calibration_items = 6
# A week that ends below zero carries the deficit into next week's budget.
carry_overspend = true
# Maintenance agents run in this fixed order, at most once each per week.
maint_order = ["security", "tests", "refactor", "knowledge"]
# Real phase only: hard per-session stop at cap * runaway_guard_multiplier (runaway guard).
runaway_guard_multiplier = 3.0
# Real phase only: per-session guard during calibration, before the cap is known.
calibration_guard_usd = 10.0
# Real phase only: wall-clock limit per agent session.
session_timeout_s = 1800

early_weeks = [1, 2, 3]
late_weeks = [6, 7, 8]

# Root seed for all simulation random streams.
seed = "agent-budget-v1"
