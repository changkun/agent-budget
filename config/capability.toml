# Capability experiment settings (PLAN-capability.md). Fixed before the paid runs.

total_cap_usd = 200.0                 # API-equivalent USD for this experiment, own ledger
work_root = "/home/user/agent-work/capability"
parallel = 6
seed = 20261009
effort = "high"                       # passed as --effort to every session
session_timeout_s = 1800
probes = ["C1", "C2", "C3", "C4", "C5", "C6"]
reps = [1, 2, 3]
sonnet_k = [15, 29]                   # Sonnet-produced states: after 15 and 29 items
producer_k = 29                       # other producers implement B01..B29
maint_agents = ["tests", "refactor"]  # run in this order when their original trigger fires
reference = "claude-sonnet-5-5"       # fixed maintainer and fixed consumer

# Short names used in state ids and job ids.
[models]
"claude-haiku-5-5" = "haiku55"
"claude-sonnet-5-5" = "sonnet55"
"claude-opus-5-5" = "opus55"
"claude-fable-5-1" = "fable51"

# Runaway guard per session (USD, passed to --max-budget-usd). Set after the feasibility
# phase to about 3x the measured maintenance session and 5x or more the probe session.
[guard_usd]
"claude-haiku-5-5" = 0.15
"claude-sonnet-5-5" = 0.60
"claude-opus-5-5" = 1.50
"claude-fable-5-1" = 4.00

# Blocks in priority order. A block runs only if the re-estimate after the feasibility
# phase keeps the projected total within total_cap_usd (PLAN-capability.md section 8).
[blocks]
order = ["core2", "core3", "A2", "A3", "A2s", "D"]
core_consumers = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]
core_producers = ["claude-haiku-5-5", "claude-opus-5-5"]
option_a = "claude-fable-5-1"
